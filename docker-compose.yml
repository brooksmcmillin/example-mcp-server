services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcpauth
      POSTGRES_USER: mcpauth
      POSTGRES_PASSWORD: mcpauth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpauth"]
      interval: 2s
      timeout: 5s
      retries: 10

  auth-server:
    build: .
    command: ["uv", "run", "python", "-m", "auth_server"]
    ports:
      - "9000:9000"
    environment:
      AUTH_SERVER_URL: "http://localhost:9000"
      DATABASE_URL: "postgresql://mcpauth:mcpauth@postgres:5432/mcpauth"
      # Credentials the resource server must present on /introspect (RFC 7662).
      # Shared with the resource-server service below; override in production.
      INTROSPECTION_CLIENT_ID: "resource-server"
      INTROSPECTION_CLIENT_SECRET: "dev-introspection-secret"  # pragma: allowlist secret
    depends_on:
      postgres:
        condition: service_healthy

  resource-server:
    build: .
    command: ["uv", "run", "python", "-m", "resource_server"]
    ports:
      - "9001:9001"
    environment:
      AUTH_SERVER_PUBLIC_URL: "http://localhost:9000"
      INTROSPECTION_URL: "http://auth-server:9000/introspect"
      RESOURCE_SERVER_URL: "http://localhost:9001"
      # Must match the auth-server's introspection credentials above.
      INTROSPECTION_CLIENT_ID: "resource-server"
      INTROSPECTION_CLIENT_SECRET: "dev-introspection-secret"  # pragma: allowlist secret
      # In-cluster clients (the demo container) reach this service by its compose
      # name; host-based MCP clients use localhost. Trust both.
      MCP_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,[::1]:*,resource-server:*"
    depends_on:
      - auth-server

  example-client:
    build: .
    command: ["uv", "run", "python", "-m", "example_client"]
    environment:
      AUTH_SERVER_URL: "http://auth-server:9000"
      RESOURCE_SERVER_URL: "http://resource-server:9001"
      # Used by the demo's direct /introspect call; matches the servers above.
      INTROSPECTION_CLIENT_ID: "resource-server"
      INTROSPECTION_CLIENT_SECRET: "dev-introspection-secret"  # pragma: allowlist secret
    depends_on:
      - auth-server
      - resource-server
    profiles:
      - demo
